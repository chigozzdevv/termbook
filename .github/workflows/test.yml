name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ${{ vars.TERMBOOK_CI_VPS == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && fromJSON('["self-hosted", "linux", "x64", "termbook-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      VITEST_MIN_THREADS: 1
      VITEST_MAX_THREADS: 2
      VITEST_MIN_FORKS: 1
      VITEST_MAX_FORKS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
  evm:
    needs: typescript
    runs-on: ${{ vars.TERMBOOK_CI_VPS == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && fromJSON('["self-hosted", "linux", "x64", "termbook-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - uses: actions/cache@v4
        with:
          path: |
            contracts/evm/cache
            contracts/evm/out
          key: ${{ runner.os }}-${{ runner.environment }}-foundry-v1.5.1-8-shards-${{ matrix.shard }}-${{ hashFiles('contracts/evm/src/**/*.sol', 'contracts/evm/test/**/*.sol', 'contracts/evm/foundry.toml', 'contracts/evm/remappings.txt', 'pnpm-lock.yaml', 'lib/forge-std/**/*.sol') }}
      - run: node scripts/checks/contracts-ci.mjs ${{ matrix.shard }} 8
      - run: sh scripts/checks/contracts.sh
  solana:
    needs: typescript
    runs-on: ${{ vars.TERMBOOK_CI_VPS == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && fromJSON('["self-hosted", "linux", "x64", "termbook-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path contracts/solana/Cargo.toml --locked
      - run: cargo test --manifest-path contracts/solana/Cargo.toml --features testnet-upgrades --locked
