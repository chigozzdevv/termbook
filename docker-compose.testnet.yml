name: termbook-testnet

services:
  mongo:
    image: mongo:7.0.14
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - ./.data/mongo:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo-init:
    image: mongo:7.0.14
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: [mongosh, --host, mongo:27017, --quiet, --eval]
    command:
      - "try { const config = rs.conf(); if (config.members.length !== 1) throw new Error('Expected single-member testnet replica set'); if (config.members[0].host !== 'mongo:27017') { config.members[0].host = 'mongo:27017'; rs.reconfig(config, {force: true}); } } catch (error) { if (error.codeName !== 'NotYetInitialized') throw error; rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}); }"

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
